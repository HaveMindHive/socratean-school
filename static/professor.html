<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Socratean, Professor</title>
    <meta name="description" content="Professor dashboard: sessions, dialogues, authenticity flags">
    <meta name="theme-color" content="#f6f2e9" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#1c1914" media="(prefers-color-scheme: dark)">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Socratean">
    <link rel="apple-touch-icon" href="/icon-180.png">
    <link rel="manifest" href="/manifest.json">
    <link rel="stylesheet" href="/styles.css">
</head>
<body>

    <header class="appbar">
        <a class="wordmark" href="/professor.html">
            <svg class="witness-glyph" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true">
                <path class="wg-fill" d="M12 3 A9 9 0 0 0 12 21 Z"/>
                <circle cx="12" cy="12" r="9" fill="none" class="wg-line" stroke-width="1.5"/>
                <line x1="12" y1="3" x2="12" y2="21" class="wg-line" stroke-width="1.5"/>
            </svg>
            Socratean
        </a>
        <div class="appbar-step">
            <a class="step-name" href="/teacher.html" style="text-decoration:underline">&larr; Courses</a>
        </div>
    </header>

    <main>
        <!-- session list -->
        <section class="screen prof-main active" id="listView">
            <div class="screen-inner">
                <h2 class="screen-title">Sessions</h2>
                <p class="screen-sub">Every dialogue, with its authenticity record.</p>

                <div class="prof-toolbar">
                    <input type="search" class="text-input" id="searchInput" placeholder="Search student or subject" autocapitalize="none">
                    <button class="refresh-btn" id="refreshBtn" aria-label="Refresh">
                        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true">
                            <path d="M15 9 a6 6 0 1 1 -1.76 -4.24" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                            <path d="M15 2 v3.2 h-3.2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </button>
                </div>

                <div id="sessionList"></div>
            </div>
        </section>

        <!-- session detail -->
        <section class="screen prof-main" id="detailView">
            <div class="screen-inner">
                <button class="back-btn" id="backBtn">
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
                        <path d="M10 3 L5 8 L10 13" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    All sessions
                </button>
                <div id="detailContent"></div>
            </div>
        </section>
    </main>

    <div class="toast" id="toast" role="status"></div>

    <script>
    (function () {
        'use strict';

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function () {
                navigator.serviceWorker.register('/sw.js').catch(function () { /* best-effort */ });
            });
        }

        var sessions = [];

        function $(id) { return document.getElementById(id); }

        function esc(s) {
            return String(s == null ? '' : s)
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        function toast(msg) {
            var el = $('toast');
            el.textContent = msg;
            el.classList.add('show');
            clearTimeout(el._t);
            el._t = setTimeout(function () { el.classList.remove('show'); }, 3200);
        }

        var token = '';
        try { token = (JSON.parse(sessionStorage.getItem('socratean_auth')) || {}).token || ''; } catch (e) { /* none */ }
        if (!token) { location.replace('/teacher.html'); }

        function api(path, body) {
            var opts = { headers: { Authorization: 'Bearer ' + token } };
            if (body !== undefined) { opts.method = 'POST'; opts.headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(body); }
            return fetch('/api' + path, opts).then(function (res) {
                if (res.status === 401) { location.replace('/teacher.html'); throw new Error('Please sign in again.'); }
                if (!res.ok) {
                    return res.text().then(function (t) {
                        throw new Error((t || '').trim() || ('Request failed (' + res.status + ')'));
                    });
                }
                return res.json();
            });
        }

        function cap(s) { return s ? s.charAt(0).toUpperCase() + s.slice(1) : ''; }

        function authClass(score) {
            if (score >= 80) return 'good';
            if (score >= 60) return 'mid';
            return 'bad';
        }

        // low ai_score = human = good
        function aiPill(aiScore) {
            var pct = Math.round((aiScore || 0) * 100);
            var cls = aiScore >= 0.6 ? 'bad' : (aiScore >= 0.4 ? 'mid' : 'good');
            return '<span class="pill ' + cls + '">AI pattern ' + pct + '%</span>';
        }

        function stylePill(styleMatch) {
            var pct = Math.round((styleMatch || 0) * 100);
            var cls = styleMatch >= 0.7 ? 'good' : (styleMatch >= 0.5 ? 'neutral' : 'mid');
            return '<span class="pill ' + cls + '">style ' + pct + '%</span>';
        }

        function fmtDate(iso) {
            if (!iso) return '';
            var d = new Date(iso);
            if (isNaN(d)) return '';
            return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' }) + ' · ' +
                   d.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
        }

        // ---------- list ----------
        function loadSessions() {
            $('sessionList').innerHTML = '<div class="empty-state"><div class="serif">Loading sessions…</div></div>';
            api('/professor/sessions')
                .then(function (r) {
                    sessions = r || [];
                    renderList();
                })
                .catch(function (err) {
                    $('sessionList').innerHTML =
                        '<div class="empty-state"><div class="serif">Could not load sessions</div><p>' + esc(err.message) + '</p></div>';
                });
        }

        function renderList() {
            var q = $('searchInput').value.trim().toLowerCase();
            var list = sessions.filter(function (s) {
                if (!q) return true;
                return (s.student_name || '').toLowerCase().indexOf(q) !== -1 ||
                       (s.subject || '').toLowerCase().indexOf(q) !== -1 ||
                       (s.topic || '').toLowerCase().indexOf(q) !== -1;
            });

            if (!list.length) {
                $('sessionList').innerHTML =
                    '<div class="empty-state"><div class="serif">No sessions' + (q ? ' match' : ' yet') + '</div>' +
                    '<p>' + (q ? 'Try a different search.' : 'Student dialogues will appear here as they begin.') + '</p></div>';
                return;
            }

            var html = list.map(function (s) {
                var certified = s.status === 'certified';
                var authHtml = certified
                    ? '<span class="sc-auth ' + authClass(s.authenticity_score) + '">' + s.authenticity_score + '% authentic</span>'
                    : '<span class="sc-auth">-</span>';
                var topicLine = s.course_title
                    ? esc(s.course_title)
                    : (s.subject
                        ? cap(esc(s.subject)) + (s.topic && s.topic !== s.subject ? ' · ' + esc(s.topic) : '')
                        : 'No subject yet');
                return (
                    '<button class="session-card" data-id="' + esc(s.id) + '">' +
                        '<div class="sc-top">' +
                            '<span class="sc-name">' + esc(s.student_name || 'Unnamed') + '</span>' +
                            '<span class="sc-status ' + esc(s.status) + '">' + esc(s.status) + '</span>' +
                        '</div>' +
                        '<div class="sc-topic">' + topicLine + '</div>' +
                        '<div class="sc-meters">' +
                            '<div class="sc-prof-track"><div class="sc-prof-fill' + (s.proficiency >= 80 ? ' reached' : '') + '" style="width:' + Math.min(100, s.proficiency || 0) + '%"></div></div>' +
                            '<span>' + (s.proficiency || 0) + '%</span>' +
                            authHtml +
                        '</div>' +
                        (s.human_label && s.human_label !== 'none recorded' ? '<div class="sc-topic" style="margin-top:6px"><span class="pill ' + (s.human_label === 'strong' ? 'good' : (s.human_label === 'little' ? 'mid' : 'neutral')) + '">thinking: ' + esc(s.human_label) + '</span></div>' : '') +
                        (s.review_signals ? '<div class="sc-topic" style="margin-top:6px"><span class="pill mid">' + s.review_signals + ' to review</span></div>' : '') +
                    '</button>'
                );
            }).join('');

            $('sessionList').innerHTML = html;
            $('sessionList').querySelectorAll('.session-card').forEach(function (card) {
                card.addEventListener('click', function () { openDetail(card.dataset.id); });
            });
        }

        $('searchInput').addEventListener('input', renderList);
        $('refreshBtn').addEventListener('click', loadSessions);

        // ---------- detail ----------
        function openDetail(id) {
            $('listView').classList.remove('active');
            $('detailView').classList.add('active');
            window.scrollTo(0, 0);
            $('detailContent').innerHTML = '<div class="empty-state"><div class="serif">Loading dialogue…</div></div>';

            api('/professor/session?id=' + encodeURIComponent(id))
                .then(renderDetail)
                .catch(function (err) {
                    $('detailContent').innerHTML =
                        '<div class="empty-state"><div class="serif">Could not load session</div><p>' + esc(err.message) + '</p></div>';
                });
        }

        var SIG_LABEL = {
            pasted_most: 'mostly pasted', pasted_part: 'some pasted', pasted_own: 'reused own words',
            paste_attempts: 'paste blocked', fast_entry: 'faster than typing', no_typing: 'no typing recorded', left_page: 'left the page'
        };
        var CTX_LABEL = { dialogue: 'Dialogue', profile: 'Voice sample', synthesis: 'Synthesis', paper: 'Paper' };

        function capPills(cap) {
            if (!cap) return '';
            var sigs = cap.signals || [], c = cap.capture || {};
            var html = '';
            sigs.forEach(function (g) {
                html += '<span class="pill ' + (g.level === 'review' ? 'mid' : 'neutral') + '">' + esc(SIG_LABEL[g.kind] || g.kind) + '</span>';
            });
            if (!sigs.length) html += '<span class="pill good">typed</span>';
            else if (!sigs.some(function (g) { return g.kind.indexOf('paste') === 0; }) && !c.pasted_chars) html += '<span class="pill good">typed</span>';
            return html;
        }

        function capWhere(cap) {
            var base = CTX_LABEL[cap.context] || cap.context;
            if (cap.context === 'dialogue') return base + ' · exchange ' + cap.exchange;
            if (cap.context === 'profile') return base + ' · answer ' + cap.exchange;
            return base;
        }

        function renderDetail(r) {
            var s = r.session || {};
            var exchanges = r.exchanges || [];
            var warnings = r.warnings || [];
            var paper = r.paper || {};

            var certified = s.status === 'certified';
            var authCls = authClass(s.authenticity_score || 0);
            var caps = r.captures || [];
            var reviewCount = 0;
            caps.forEach(function (cp) { (cp.signals || []).forEach(function (g) { if (g.level === 'review') reviewCount++; }); });
            var capByExchange = {};
            caps.forEach(function (cp) { if (cp.context === 'dialogue') capByExchange[cp.exchange] = cp; });

            var html = '';
            html += '<div class="detail-head">';
            html += '<h2>' + esc(s.student_name || 'Unnamed') + '</h2>';
            html += '<div class="dh-sub">' + cap(esc(s.subject || '')) +
                    (s.topic && s.topic !== s.subject ? ' · ' + esc(s.topic) : '') +
                    (s.created_at ? ' · started ' + fmtDate(s.created_at) : '') + '</div>';

            html += '<div class="detail-stats">';
            html += '<div class="d-stat"><div class="d-val' + (s.proficiency >= 80 ? ' good' : '') + '">' + (s.proficiency || 0) + '%</div><div class="d-label">proficiency</div></div>';
            html += '<div class="d-stat"><div class="d-val' + (certified ? ' ' + authCls : '') + '">' + (certified ? (s.authenticity_score || 0) + '%' : '-') + '</div><div class="d-label">authenticity</div></div>';
            html += '<div class="d-stat"><div class="d-val">' + exchanges.length + '</div><div class="d-label">exchanges</div></div>';
            html += '<div class="d-stat"><div class="d-val' + (reviewCount ? ' mid' : '') + '">' + reviewCount + '</div><div class="d-label">to review</div></div>';
            html += '</div></div>';

            html += '<div class="inline-note ' + (s.accommodation ? 'warn' : '') + '" style="margin:12px 0">' +
                    (s.accommodation
                        ? 'Assistive tools are on for this student. Signals stay on record but do not lower their authenticity score.'
                        : 'Signals below are facts about how each answer was written. They are not a verdict.') +
                    ' <button class="linkbtn" id="accomBtn" style="font:inherit;font-size:14px;background:none;border:0;color:var(--accent-deep);text-decoration:underline;cursor:pointer;min-height:36px">' +
                    (s.accommodation ? 'Turn off' : 'This student uses dictation or assistive tools') + '</button></div>';

            var st = r.style || {};
            if (st.names && st.names.length) {
                html += '<div class="warning-card" style="border-left-color:var(--authentic)"><span class="w-type">How this student learns best</span> ' +
                    esc(st.names.join(' and ')) + '<div class="hint">Read from ' + st.answers + ' of their answers. The tutor leads its teaching this way.</div></div>';
            }
            // Signature method: signs of a person thinking come first, in the student's own words
            var hum = r.human || {};
            var KIND = { hedging: 'thinking out loud', self_correction: 'changed their mind', analogy: 'analogy', personal: 'own life', own_question: 'own question',
                         unsure: 'said what confused them', own_phrase: 'own phrase', callback: 'built on earlier words', revised: 'reworded as they wrote', paused: 'paused to think' };
            if (hum.answers) {
                var humCls = hum.label === 'strong' ? 'good' : (hum.label === 'some' || hum.label === 'too early' ? 'neutral' : 'mid');
                html += '<div class="section-title">Signs of a person thinking</div>' +
                    '<div class="warning-card" style="border-left-color:var(--authentic)"><span class="pill ' + humCls + '">' + esc(hum.label) + '</span> ' +
                    hum.with_signs + ' of ' + hum.answers + ' answers show at least one sign' +
                    ((hum.kind_names || []).length ? ': ' + (hum.kind_names || []).map(function (k) { return esc(KIND[k] || k) + ' (' + hum.kinds[k] + ')'; }).join(', ') : '') + '.' +
                    '<div class="hint">These come from the student\'s own words and how they were typed. They support your judgment and are not proof.</div></div>';
                caps.forEach(function (cp) {
                    var hs = (cp.signals || []).filter(function (g) { return g.level === 'human'; });
                    if (!hs.length) return;
                    html += '<div class="warning-card" style="border-left-color:var(--authentic)"><span class="w-type">' + esc(capWhere(cp)) + '</span>' +
                        hs.map(function (g) { return '<div style="margin-top:6px">' + esc(g.detail) + '</div>'; }).join('') + '</div>';
                });
            }

            var flagged = caps.filter(function (cp) { return (cp.signals || []).some(function (g) { return g.level !== 'human'; }); });
            if (flagged.length) {
                html += '<div class="section-title">Worth a look: how answers were written</div>';
                flagged.forEach(function (cp) {
                    var c = cp.capture || {};
                    html += '<div class="warning-card"><span class="w-type">' + esc(capWhere(cp)) + '</span>';
                    cp.signals.filter(function (g) { return g.level !== 'human'; }).forEach(function (g) {
                        html += '<div style="margin-top:6px"><span class="pill ' + (g.level === 'review' ? 'mid' : 'neutral') + '">' + (g.level === 'review' ? 'review' : 'context') + '</span> ' + esc(g.detail) + '</div>';
                    });
                    (c.pasted || []).forEach(function (p) {
                        if (p && p.trim()) html += '<div class="w-excerpt">Pasted: &ldquo;' + esc(p.length > 300 ? p.slice(0, 300) + '…' : p) + '&rdquo;</div>';
                    });
                    html += '<div class="hint">typed ' + (c.typed_chars || 0) + ' characters &middot; pasted ' + (c.pasted_chars || 0) +
                            ' &middot; ' + (c.deletions || 0) + ' deletions' + (c.away_ms ? ' &middot; away ' + Math.round(c.away_ms / 1000) + 's' : '') + '</div></div>';
                });
            }

            var objectives = r.objectives || [];
            if (objectives.length) {
                var done = objectives.filter(function (o) { return o.demonstrated; }).length;
                html += '<div class="section-title">Learning objectives &middot; ' + done + ' of ' + objectives.length + ' shown</div>';
                objectives.forEach(function (o) {
                    html += '<div class="warning-card" style="border-left-color:' + (o.demonstrated ? 'var(--authentic)' : 'var(--line-strong)') + '">' +
                            '<span class="w-type">' + (o.demonstrated ? 'Shown' : 'Not yet') + ' &middot; ' + esc(o.name) + '</span>' +
                            (o.evidence ? '<div class="w-excerpt">&ldquo;' + esc(o.evidence) + '&rdquo;</div>' : '') +
                            (o.judge === 'keyword' ? '<div class="hint">Matched by keyword because no AI model is connected. Read the quote and decide for yourself.</div>' : '') +
                            '</div>';
                });
            }

            if (warnings.length) {
                html += '<div class="section-title">Text signals (weak)</div>';
                warnings.forEach(function (w) {
                    var label = w.type === 'ai_detected'
                        ? 'Possible AI-written passage (score ' + Math.round((w.score || 0) * 100) + '%)'
                        : 'Style deviation (match ' + Math.round((w.score || 0) * 100) + '%)';
                    html += '<div class="warning-card"><span class="w-type">Exchange ' + w.exchange + ' · ' + label + '</span>' +
                            (w.excerpt ? '<div class="w-excerpt">“' + esc(w.excerpt) + '”</div>' : '') + '</div>';
                });
            }

            html += '<div class="section-title">The dialogue</div>';
            if (!exchanges.length) {
                html += '<div class="empty-state"><p>No exchanges yet.</p></div>';
            }
            exchanges.forEach(function (ex, i) {
                html += '<div class="exchange">';
                html += '<div class="ex-num">Exchange ' + (i + 1) + (ex.timestamp ? ' · ' + fmtDate(ex.timestamp) : '') + '</div>';
                if (ex.human && ex.human.trim()) {
                    html += '<div class="msg student" style="margin-left:auto">' +
                            '<div class="bubble">' + esc(ex.human) + '</div>' +
                            '<div class="ex-pills">' + aiPill(ex.ai_score) + stylePill(ex.style_match) +
                            capPills(capByExchange[i + 1]) +
                            (ex.concepts_addressed ? '<span class="pill neutral">' + esc(ex.concepts_addressed) + '</span>' : '') +
                            '</div></div>';
                }
                if (ex.ai) {
                    html += '<div class="msg tutor" style="margin-top:10px">' +
                            '<div class="tutor-name">Socratean</div>' +
                            '<div class="bubble">' + esc(ex.ai) + '</div></div>';
                }
                html += '</div>';
            });

            if (paper.title || paper.content) {
                html += '<div class="section-title">Final paper</div>';
                html += '<div class="paper-card">';
                html += '<h3>' + esc(paper.title || 'Untitled') + '</h3>';
                if (paper.score) {
                    html += '<div style="margin-bottom:12px"><span class="pill ' + authClass(paper.score) + '">' + paper.score + '% authentic</span></div>';
                }
                html += '<div class="paper-body">' + esc(paper.content || '') + '</div>';
                html += '</div>';
            }

            $('detailContent').innerHTML = html;
            var ab = $('accomBtn');
            if (ab) ab.addEventListener('click', function () {
                api('/teacher/session/accommodation', { id: s.id, on: !s.accommodation })
                    .then(function () { openDetail(s.id); })
                    .catch(function (err) { toast(err.message); });
            });
        }

        $('backBtn').addEventListener('click', function () {
            $('detailView').classList.remove('active');
            $('listView').classList.add('active');
            window.scrollTo(0, 0);
        });

        loadSessions();
    })();
    </script>
</body>
</html>
